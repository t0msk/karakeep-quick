name: Release build

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Bump version
        id: bump
        env:
          BUMP_INPUT: ${{ github.event.inputs.bump }}
        run: |
          BUMP_TYPE="${BUMP_INPUT:-patch}"
          NEW_VERSION=$(npm version "$BUMP_TYPE" --no-git-tag-version)
          NEW_VERSION="${NEW_VERSION#v}"
          echo "Bumped version to $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Surgical replace so the rest of manifest.json's formatting (e.g.
          # inline arrays) is left untouched, instead of round-tripping the
          # whole file through JSON.parse/stringify.
          sed -i -E "0,/\"version\": \"[^\"]+\"/s//\"version\": \"${NEW_VERSION}\"/" public/manifest.json

      - name: Build
        run: npm run build

      - name: Package extension zip
        id: package
        run: |
          ZIP_NAME="karakeep-quick-extension-${{ steps.bump.outputs.version }}.zip"
          cd dist
          zip -r "../$ZIP_NAME" . -x '.*'
          cd ..
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:release

      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip_name }}
